name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Frontend Typecheck and Build Validation
        run: |
          npm --prefix frontend run check

      - name: Rust Code Formatting Check
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy Analysis
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust Automated Test Suite
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --verbose
